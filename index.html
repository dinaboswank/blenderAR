<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AR</title>

  <!-- model-viewer von Google: zeigt das Modell im Browser und startet AR
       (Android: WebXR / Scene Viewer, iPhone: AR Quick Look) -->
  <script type="module"
    src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>

  <style>
    html, body { margin: 0; height: 100%; }
    body {
      font-family: system-ui, sans-serif;
      background: #e9e9e6;
      color: #1d1d1b;
    }
    model-viewer {
      width: 100%;
      height: 100%;
      background: transparent;
      --poster-color: transparent;
    }
    /* Eigener AR-Button */
    #ar-knopf {
      position: absolute;
      left: 50%;
      bottom: max(6%, env(safe-area-inset-bottom));
      transform: translateX(-50%);
      border: 0;
      border-radius: 999px;
      padding: 16px 28px;
      font: 600 17px/1 system-ui, sans-serif;
      background: #1d1d1b;
      color: #fff;
      box-shadow: 0 4px 16px rgba(0,0,0,.25);
      cursor: pointer;
    }
    #ar-knopf:focus-visible { outline: 3px solid #4a7dff; outline-offset: 3px; }
    #hinweis {
      position: absolute;
      top: 5%;
      left: 0; right: 0;
      text-align: center;
      font-size: 15px;
      line-height: 1.4;
      padding: 0 1.5em;
      pointer-events: none;
    }
    #kein-ar {
      display: none;
      position: absolute;
      bottom: 6%;
      left: 0; right: 0;
      text-align: center;
      font-size: 15px;
      padding: 0 1.5em;
    }
    /* Ladebalken */
    #ladebalken {
      position: absolute;
      top: 0; left: 0;
      height: 3px;
      width: 0;
      background: #1d1d1b;
      transition: width .2s;
    }
  </style>
</head>
<body>

  <!--
    ar                  = AR erlauben
    ar-modes            = Reihenfolge der AR-Techniken (je nach Handy)
    ar-placement="floor"= Modell wird auf den Boden gestellt ("wall" für Wände)
    ar-scale="auto"     = mit zwei Fingern skalierbar; Originalgröße = Blender-Maße in Metern
    camera-controls     = vor dem AR-Start mit dem Finger drehen/zoomen
  -->
  <model-viewer
    id="viewer"
    src="./modell.glb"
    alt="3D-Modell"
    ar
    ar-modes="webxr scene-viewer quick-look"
    ar-placement="floor"
    ar-scale="auto"
    camera-controls
    touch-action="pan-y"
    shadow-intensity="1"
    exposure="1">

    <div id="ladebalken" slot="progress-bar"></div>

    <button id="ar-knopf" slot="ar-button">Im Raum ansehen</button>
  </model-viewer>

  <div id="hinweis">Modell mit dem Finger drehen – oder im Raum platzieren</div>
  <div id="kein-ar">Dieses Gerät unterstützt kein AR im Browser. Du kannst das Modell hier drehen und zoomen.</div>

  <script>
    const viewer = document.getElementById('viewer');
    const balken = document.getElementById('ladebalken');

    // Ladefortschritt anzeigen
    viewer.addEventListener('progress', (e) => {
      const p = e.detail.totalProgress;
      balken.style.width = (p * 100) + '%';
      if (p === 1) setTimeout(() => balken.style.display = 'none', 300);
    });

    // Hinweis, falls AR nicht geht
    viewer.addEventListener('load', () => {
      if (!viewer.canActivateAR) {
        document.getElementById('kein-ar').style.display = 'block';
      }
    });

    // Hinweis ausblenden, sobald jemand das Modell anfasst
    viewer.addEventListener('camera-change', (e) => {
      if (e.detail.source === 'user-interaction') {
        document.getElementById('hinweis').style.display = 'none';
      }
    });
  </script>
</body>
</html>
