<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Baumhäuser</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --flechte: #dfe3d6;
      --moos: #23301f;
      --rinde: #6b4f2a;
      --blatt: #a9b896;
      --weiss: #f6f7f2;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--flechte);
      color: var(--moos);
      font-family: "Manrope", system-ui, sans-serif;
      padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
    }
    header {
      padding: 12vw 6vw 6vw;
      max-width: 60rem;
      margin: 0 auto;
    }
    h1 {
      font-size: clamp(2.6rem, 12vw, 6rem);
      line-height: .9;
      margin: 0 0 .4em;
      font-weight: 800;
      letter-spacing: -.04em;
    }
    header p {
      margin: 0;
      font-size: 1.05rem;
      line-height: 1.45;
      max-width: 32em;
    }
    ul {
      list-style: none;
      margin: 0 auto;
      padding: 0 6vw 10vw;
      max-width: 60rem;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 18px;
    }
    a {
      display: block;
      color: inherit;
      text-decoration: none;
    }
    a:focus-visible { outline: 3px solid var(--rinde); outline-offset: 4px; }
    .bild {
      aspect-ratio: 3 / 4;
      background: var(--blatt);
      overflow: hidden;
      display: grid;
      place-items: center;
    }
    .bild img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .bild .ersatz { font-size: 3rem; font-weight: 800; color: var(--weiss); }
    .name { font-weight: 600; font-size: 1.1rem; margin: .5em 0 .1em; }
    .text { font-size: .95rem; line-height: 1.35; opacity: .8; margin: 0; }
  </style>
</head>
<body>
  <header>
    <h1>Baumhäuser</h1>
    <p>Wähle ein Baumhaus aus und schau es dir anschließend mit der Kamera im Baum an.</p>
  </header>

  <ul id="liste"></ul>

  <script src="modelle.js"></script>
  <script>
    const liste = document.getElementById('liste');
    MODELLE.forEach((m, i) => {
      const li = document.createElement('li');
      const nr = i + 1;
      li.innerHTML = `
        <a href="ansicht.html?id=${encodeURIComponent(m.id)}">
          <div class="bild"><span class="ersatz">${nr}</span></div>
          <div class="name"></div>
          ${m.text ? '<p class="text"></p>' : ''}
        </a>`;
      li.querySelector('.name').textContent = m.name;
      if (m.text) li.querySelector('.text').textContent = m.text;

      // Vorschaubild nur zeigen, wenn es existiert
      if (m.bild) {
        const img = new Image();
        img.alt = '';
        img.onload = () => {
          const box = li.querySelector('.bild');
          box.innerHTML = '';
          box.appendChild(img);
        };
        img.src = 'bilder/' + m.bild;  // Bilder liegen im Ordner bilder
      }
      liste.appendChild(li);
    });
  </script>
</body>
</html>
